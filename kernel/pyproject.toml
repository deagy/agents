[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sdlc"
dynamic = ["version"]
description = "Portable G1-G10 Agentic SDLC lifecycle kernel: bootstrap, plan, and validate a project overlay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema[format]==4.26.0",
]

[project.urls]
Repository = "https://github.com/deagy/agentic-sdlc"

[project.scripts]
agentic-sdlc = "agentic_sdlc:main"

[tool.hatch.version]
path = "agentic_sdlc/__init__.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
# dev_entrypoint.py (sibling to this file, used only by bin/agentic-sdlc and
# the test suite for running the checkout in place) is deliberately not
# listed here or in the sdist include list below, so it never ships in the
# installed/pipx distribution.
packages = ["agentic_sdlc"]

# contracts/ stays a single source of truth at plugins/agentic-sdlc/contracts/
# (agentic_sdlc_langgraph/agentic_sdlc_langgraph/runtime.py also reads it
# directly from that fixed repo-relative path) rather than being duplicated
# under agentic_sdlc/ in the source tree. force-include copies it into the
# built wheel only, at build time, so an installed/pipx distribution carries
# its own bundled copy without the checkout ever having two live copies to
# keep in sync. See agentic_sdlc/__init__.py's PLUGIN_ROOT resolution for the
# runtime lookup that matches this.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "agentic_sdlc/contracts"

[tool.hatch.build.targets.sdist]
include = [
    "agentic_sdlc/**",
    "contracts/**",
    "README.md",
]
