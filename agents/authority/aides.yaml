# Data table for the generated authority-aide AGENT.md files.
#
# Same 2-space-id / 4-space-field shape as catalog.yaml's `agents:` block, so
# both are read by the single parse_keyed_entries() primitive in routing.py
# instead of two independently hand-rolled parsers. Each id maps to the
# human-authority title and gate numbers that
# agents/orchestration/src/generate_authority_aides.py renders through
# agents/authority/_template.md.tmpl. Regenerate after editing this file:
#
#     python3 agents/orchestration/src/generate_authority_aides.py
#
# Validate deterministically without changing the working tree:
#
#     python3 agents/orchestration/src/generate_authority_aides.py --check

aides:
  product-owner-aide:
    title: Product Owner
    gates: [1, 2, 6]
  engineering-lead-aide:
    title: Engineering Lead
    gates: [2, 6]
  system-architect-aide:
    title: System Architect
    gates: [3]
  governance-lead-aide:
    title: Governance Lead
    gates: [4]
  security-lead-aide:
    title: Security Lead
    gates: [5]
  release-owner-aide:
    title: Release Owner
    gates: [7, 8]
  release-authority-aide:
    title: Release Authority
    gates: [9]
  service-owner-aide:
    title: Service Owner
    gates: [10]
