[project]
name = "agentic-sdlc-langgraph"
version = "0.3.0"
description = "LangGraph-based execution engine for the Agentic SDLC G1-G10 lifecycle (Phase 0 spike: G1-G3)."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "jsonschema>=4.23",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "uvicorn>=0.30",
]

[project.scripts]
agentic-sdlc-lg = "agentic_sdlc_langgraph.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_sdlc_langgraph"]
