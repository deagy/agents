name: validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTIC_SDLC_BIN: ${{ github.workspace }}/.dependencies/agentic-sdlc/bin/agentic-sdlc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deagy/agentic-sdlc
          ref: v0.3.0
          path: .dependencies/agentic-sdlc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --no-cache-dir --require-hashes -r .github/requirements-validation.lock
      - run: python -B -m unittest discover -s agents/orchestration/test -p "test_*.py"
      - run: python -B -m unittest discover -s agents/knowledge-store/test -p "test_*.py"
      - run: python -B -m unittest discover -s agents/shared/test -p "test_*.py"
      - run: ./bin/cadre help
      - run: ./bin/cadre select --task "CI wrapper smoke test" --files README.md --classification internal --task-id CI-SMOKE-1 >/dev/null
      - run: ./bin/cadre generate-plugin --check
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc --version
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc provider list
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc profile list
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc extension list
      - run: |
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract provider.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract profile.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract extension.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract selection.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract agent-catalog.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract artifact.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract dispatch-bindings.schema >/dev/null

  cline-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Pinned to the version this plugin's known-limitation note (README/RUNBOOK) is
      # scoped to; bump deliberately, not implicitly via an unpinned `latest` install.
      - run: npm install -g cline@3.0.46
      # Real install/uninstall smoke test against the packaged plugin source,
      # catching manifest/packaging regressions rather than relying on doc-trust.
      #
      # `cline plugin install` logs a non-fatal `mcpSyncFailures` entry when its
      # own sandboxed MCP-sync subprocess can't find a file under its installed
      # package tree; that has been observed to coincide with cline's global npm
      # binary transiently disappearing immediately afterward (an orphaned `npm
      # update cline` process shows up in job cleanup logs), breaking the very
      # next `cline` invocation with "command not found" -- an upstream
      # packaging/self-repair race, not a regression in this repository.
      # Reinstalling immediately on top of that in-flight background process
      # only trades one race for another (`npm error ENOTEMPTY ... rename
      # .../node_modules/cline -> .../node_modules/.cline-*`, two npm
      # processes fighting over the same directory) -- so wait for the
      # binary to reappear on its own first, and only reinstall, patiently
      # retrying through any such collision, if it genuinely doesn't.
      - name: cline plugin install (self-healing retry)
        run: |
          set -eu
          wait_for_cline() {
            for i in 1 2 3 4 5 6; do
              command -v cline >/dev/null 2>&1 && return 0
              sleep 5
            done
            return 1
          }
          reinstall_cline() {
            for i in 1 2 3; do
              npm install -g cline@3.0.46 && return 0
              echo "reinstall attempt $i failed, likely racing cline's own background self-repair; waiting" >&2
              sleep 10
            done
            return 1
          }
          for attempt in 1 2 3; do
            if wait_for_cline && cline plugin install --json "$GITHUB_WORKSPACE/plugins/cline"; then
              exit 0
            fi
            echo "attempt $attempt: cline plugin install failed; attempting reinstall" >&2
            reinstall_cline || true
          done
          exit 1
      - name: cline plugin uninstall (self-healing retry)
        run: |
          set -eu
          wait_for_cline() {
            for i in 1 2 3 4 5 6; do
              command -v cline >/dev/null 2>&1 && return 0
              sleep 5
            done
            return 1
          }
          reinstall_cline() {
            for i in 1 2 3; do
              npm install -g cline@3.0.46 && return 0
              echo "reinstall attempt $i failed, likely racing cline's own background self-repair; waiting" >&2
              sleep 10
            done
            return 1
          }
          for attempt in 1 2 3; do
            if wait_for_cline && cline plugin uninstall @deagy/cadre-cline-plugin --json; then
              exit 0
            fi
            echo "attempt $attempt: cline plugin uninstall failed; attempting reinstall" >&2
            reinstall_cline || true
          done
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --redact --source /repo
