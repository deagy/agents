name: validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTIC_SDLC_BIN: ${{ github.workspace }}/.dependencies/agentic-sdlc/bin/agentic-sdlc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deagy/agentic-sdlc
          # SHA-pinned, not `v0.13.0`: this checkout's bin/agentic-sdlc is
          # *executed* by the steps below, so a moved tag would be arbitrary
          # code execution in this workflow. Same convention as the actions
          # pinned above. Bump deliberately alongside the kernel_compatibility
          # range in provider/provider.json.
          ref: b105388b465aa6b4ec1b331d24579b6160242927 # v0.13.0
          path: .dependencies/agentic-sdlc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deagy/cadre-lifecycle
          ref: ${{ github.sha }}
          path: .dependencies/cadre-lifecycle
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deagy/cadre-profile-secure-cloud
          ref: ${{ github.sha }}
          path: .dependencies/cadre-profile-secure-cloud
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --no-cache-dir --require-hashes -r .github/requirements-validation.lock
      - run: python -B -m unittest discover -s roster/orchestration/test -p "test_*.py"
      - run: python -B -m unittest discover -s roster/knowledge-store/test -p "test_*.py"
      - run: python -B -m unittest discover -s roster/shared/test -p "test_*.py"
      - run: ./bin/cadre help
      - run: ./bin/cadre select --task "CI wrapper smoke test" --files README.md --classification internal --task-id CI-SMOKE-1 >/dev/null
      - run: python roster/orchestration/src/schema_validate.py
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc --version
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc provider list
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc profile list
      - run: AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc extension list
      - run: |
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract provider.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract profile.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract extension.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract selection.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract agent-catalog.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract artifact.schema >/dev/null
          AGENTIC_SDLC_BIN="$AGENTIC_SDLC_BIN" ./bin/cadre sdlc show-contract dispatch-bindings.schema >/dev/null

  cross-repo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deagy/cadre-lifecycle
          ref: ${{ github.sha }}
          path: .dependencies/cadre-lifecycle
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deagy/cadre-profile-secure-cloud
          ref: ${{ github.sha }}
          path: .dependencies/cadre-profile-secure-cloud
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run cross-repository integration tests
        run: |
          # Update paths in integration test to use CI checkout locations
          sed -i \
            -e "s|CADRE_LIFECYCLE_ROOT = Path.*/home/deagy/sdk/cadre-lifecycle|CADRE_LIFECYCLE_ROOT = Path(\"$GITHUB_WORKSPACE/.dependencies/cadre-lifecycle\")|" \
            -e "s|AGENTIC_SDLC_ROOT = Path.*/home/deagy/sdk/agentic-sdlc|AGENTIC_SDLC_ROOT = Path(\"$GITHUB_WORKSPACE/.dependencies/agentic-sdlc\")|" \
            -e "s|new_repo_path = Path.*/home/deagy/sdk/cadre-profile-secure-cloud|new_repo_path = Path(\"$GITHUB_WORKSPACE/.dependencies/cadre-profile-secure-cloud\")|" \
            tests/integration/test_cross_repo_integration.py
          python -m unittest tests/integration/test_cross_repo_integration.py

  cadre-pip-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Version-pinned to the exact release reviewed/verified for this job
      # (see supply-chain-security-reviewer finding on PR #48) rather than an
      # unbounded `pip install build`; not part of the hash-pinned
      # requirements-validation.lock mechanism since it is a single
      # build-only tool, not a runtime/test dependency of this repository's
      # own Python code.
      - run: pip install --no-cache-dir build==1.5.0
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist
      - name: Confirm LICENSE is packaged into both build targets
        run: |
          set -eu
          python -m zipfile -l dist/cadre-*.whl | grep -i 'licenses/LICENSE'
          tar tzf dist/cadre-*.tar.gz | grep -E '^cadre-[^/]+/LICENSE$'
      - name: Install the built wheel into an isolated venv
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/cadre-venv"
          "$RUNNER_TEMP/cadre-venv/bin/pip" install --no-cache-dir dist/cadre-*.whl
      # Run every smoke command from outside the checkout ($RUNNER_TEMP, not
      # $GITHUB_WORKSPACE) so this only exercises what an installed
      # distribution can see on its own, the same regression guard the
      # deagy/cadre-lifecycle's own CI provides for the plugin distribution.
      - name: Smoke test the installed cadre distribution from outside the checkout
        run: |
          set -eu
          CADRE="$RUNNER_TEMP/cadre-venv/bin/cadre"
          WORKDIR="$RUNNER_TEMP/cadre-pip-smoke"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          echo "cadre pip/pipx distribution smoke test" > README.md

          "$CADRE" help >/dev/null
          "$CADRE" select --root . --task "CI pip package smoke test" \
            --files README.md --classification internal \
            --task-id ci-pip-smoke-1 >/dev/null

          # generate-role-metadata --check is read-only and genuinely
          # expected to work from an install (see cadre_cli/__init__.py).
          "$CADRE" generate-role-metadata --check >/dev/null

          # Maintainer/regeneration subcommands must fail closed (non-zero
          # exit, no raw traceback) rather than writing into site-packages
          # or crashing -- see cadre_cli/__init__.py's
          # _CHECKOUT_ONLY_SUBCOMMANDS / _requires_checkout().
          for cmd in generate-plugin generate-authority-aides; do
            if output=$("$CADRE" $cmd 2>&1); then
              echo "cadre $cmd unexpectedly succeeded from an installed distribution" >&2
              exit 1
            fi
            if echo "$output" | grep -qi 'Traceback'; then
              echo "cadre $cmd failed with a raw traceback instead of failing closed cleanly:" >&2
              echo "$output" >&2
              exit 1
            fi
          done

          # generate-role-metadata's default (write) mode is the same class
          # of problem and must also fail closed, distinctly from --check.
          if output=$("$CADRE" generate-role-metadata 2>&1); then
            echo "cadre generate-role-metadata (default mode) unexpectedly succeeded from an installed distribution" >&2
            exit 1
          fi
          if echo "$output" | grep -qi 'Traceback'; then
            echo "cadre generate-role-metadata (default mode) failed with a raw traceback instead of failing closed cleanly:" >&2
            echo "$output" >&2
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --redact --source /repo --config /repo/.gitleaks.toml
