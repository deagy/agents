name: validate

# One workflow for what used to be three, in three repositories. The jobs
# that existed only to reconcile those repositories are gone:
#
#   cross-repo-integration  checked out deagy/cadre-lifecycle and
#                           deagy/cadre-profile-secure-cloud, rewrote three
#                           hardcoded /home/deagy/sdk/* paths with sed, then
#                           ran tests/integration/test_cross_repo_integration.py
#                           -- a committed 0-byte file. It had been passing
#                           without testing anything.
#   generated-content       (cadre-lifecycle) re-generated the plugin from the
#                           cadre revision pinned in cadre-ref.txt and diffed
#                           it against the committed copy. There is no
#                           committed copy now, and no pinned revision.
#
# The kernel is no longer checked out from another repository either, so
# AGENTIC_SDLC_BIN points into this tree.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  roster:
    name: roster/ (selection, knowledge store, shared policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTIC_SDLC_BIN: ${{ github.workspace }}/bin/agentic-sdlc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --no-cache-dir --require-hashes -r .github/requirements-validation.lock
      - run: python -B -m unittest discover -s roster/orchestration/test -p "test_*.py"
      - run: python -B -m unittest discover -s roster/knowledge-store/test -p "test_*.py"
      - run: python -B -m unittest discover -s roster/shared/test -p "test_*.py"
      - run: ./bin/cadre help
      - run: ./bin/cadre select --task "CI wrapper smoke test" --files README.md --classification internal --task-id CI-SMOKE-1 >/dev/null
      - run: python roster/orchestration/src/schema_validate.py
      # The kernel is in-tree now, so these exercise the real wiring rather
      # than a SHA-pinned checkout of another repository.
      - run: ./bin/cadre sdlc --version
      - run: ./bin/cadre sdlc provider list
      - run: ./bin/cadre sdlc profile list
      - run: ./bin/cadre sdlc extension list
      - run: |
          set -eu
          for contract in provider.schema profile.schema extension.schema \
                          selection.schema agent-catalog.schema artifact.schema \
                          dispatch-bindings.schema; do
            ./bin/cadre sdlc show-contract "$contract" >/dev/null
          done

  kernel:
    name: kernel/ (G1-G10 lifecycle kernel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --no-cache-dir -r kernel/requirements-validation.txt
      - run: python -B -m unittest discover -s kernel/test -p "test_*.py"
      - run: ./bin/agentic-sdlc --version
      - name: Install the packaged distribution (pip/pipx install path)
        run: pip install --no-cache-dir ./kernel
      - name: Verify the installed console script works outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          agentic-sdlc --version
          agentic-sdlc show-contract lifecycle-gates >/dev/null

  engine:
    name: engine/ (LangGraph orchestration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies (fails on lockfile drift)
        working-directory: engine
        run: uv sync --locked
      - name: Run LangGraph engine tests
        working-directory: engine
        run: uv run pytest

  plugin-tools:
    name: plugin/tools (packaging, docs guards, kernel bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # One tools/ directory now: bootstrap_sdlc.py used to exist as three
      # byte-identical copies under plugins/lifecycle{,-github,-gitlab}/tools/,
      # each with its own test module and a duplication-health test holding
      # them in sync.
      - run: python3 -m unittest discover -s plugin/tools -p "test_*.py" -v

  cadre-pip-package:
    name: cadre pip/pipx distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Version-pinned to the exact release reviewed/verified for this job
      # (see supply-chain-security-reviewer finding on PR #48) rather than an
      # unbounded `pip install build`; not part of the hash-pinned
      # requirements-validation.lock mechanism since it is a single
      # build-only tool, not a runtime/test dependency of this repository's
      # own Python code.
      - run: pip install --no-cache-dir build==1.5.0
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist
      - name: Confirm LICENSE is packaged into both build targets
        run: |
          set -eu
          python -m zipfile -l dist/cadre-*.whl | grep -i 'licenses/LICENSE'
          tar tzf dist/cadre-*.tar.gz | grep -E '^cadre-[^/]+/LICENSE$'
      - name: Install the built wheel into an isolated venv
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/cadre-venv"
          "$RUNNER_TEMP/cadre-venv/bin/pip" install --no-cache-dir dist/cadre-*.whl
      # Run every smoke command from outside the checkout ($RUNNER_TEMP, not
      # $GITHUB_WORKSPACE) so this only exercises what an installed
      # distribution can see on its own.
      - name: Smoke test the installed cadre distribution from outside the checkout
        run: |
          set -eu
          CADRE="$RUNNER_TEMP/cadre-venv/bin/cadre"
          WORKDIR="$RUNNER_TEMP/cadre-pip-smoke"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          echo "cadre pip/pipx distribution smoke test" > README.md

          "$CADRE" help >/dev/null
          "$CADRE" select --root . --task "CI pip package smoke test" \
            --files README.md --classification internal \
            --task-id ci-pip-smoke-1 >/dev/null

          # generate-role-metadata --check is read-only and genuinely
          # expected to work from an install (see cadre_cli/__init__.py).
          "$CADRE" generate-role-metadata --check >/dev/null

          # Maintainer/regeneration subcommands must fail closed (non-zero
          # exit, no raw traceback) rather than writing into site-packages
          # or crashing -- see cadre_cli/__init__.py's
          # _CHECKOUT_ONLY_SUBCOMMANDS / _requires_checkout().
          for cmd in generate-plugin generate-authority-aides; do
            if output=$("$CADRE" $cmd 2>&1); then
              echo "cadre $cmd unexpectedly succeeded from an installed distribution" >&2
              exit 1
            fi
            if echo "$output" | grep -qi 'Traceback'; then
              echo "cadre $cmd failed with a raw traceback instead of failing closed cleanly:" >&2
              echo "$output" >&2
              exit 1
            fi
          done

          # generate-role-metadata's default (write) mode is the same class
          # of problem and must also fail closed, distinctly from --check.
          if output=$("$CADRE" generate-role-metadata 2>&1); then
            echo "cadre generate-role-metadata (default mode) unexpectedly succeeded from an installed distribution" >&2
            exit 1
          fi
          if echo "$output" | grep -qi 'Traceback'; then
            echo "cadre generate-role-metadata (default mode) failed with a raw traceback instead of failing closed cleanly:" >&2
            echo "$output" >&2
            exit 1
          fi

  cline-plugins:
    name: plugin/cline* (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cline, cline-agents, cline-lifecycle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      # plugin/package.json declares npm workspaces (cline, cline-agents,
      # cline-lifecycle) backed by a single lockfile, so `npm ci` runs from
      # plugin/ rather than each package directory.
      - run: npm ci
        working-directory: plugin
      - run: npm test
        working-directory: plugin/${{ matrix.package }}
      - run: npm run typecheck
        working-directory: plugin/${{ matrix.package }}

  generated-content:
    name: plugin/ generated content matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The generated half of plugin/ is committed because a GitHub-sourced
      # marketplace serves the repository tree -- an uncommitted distribution
      # installs a plugin with no roles in it. This job is what makes that
      # safe: source and output live in one commit, and drift fails the PR
      # that introduced it rather than being reconciled weeks later by a
      # scheduled cross-repo job.
      - name: Regenerate into a scratch directory
        run: ./bin/cadre generate-plugin --output "$RUNNER_TEMP/regen"
      - name: Fail on any difference from the committed distribution
        run: |
          set -eu
          # README.md is hand-authored here (the generator leaves an
          # already-initialized package's README alone); everything else the
          # generator emits must match byte for byte.
          for path in agents skills suite codex-agents profiles extensions \
                      agent-catalog.json provider.json bin; do
            diff -r "$RUNNER_TEMP/regen/$path" "plugin/$path"
          done
          diff -r "$RUNNER_TEMP/regen/plugins/lifecycle/skills" plugin/plugins/lifecycle/skills

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --redact --source /repo --config /repo/.gitleaks.toml
