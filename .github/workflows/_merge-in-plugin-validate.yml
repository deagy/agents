name: Validate

# Runs this repository's four documented test/typecheck suites (see
# AGENTS.md's "Build, Test, and Development Commands" and CLAUDE.md's
# "Commands") on every pull request targeting main and on every push to
# main. Previously these were manual-only -- release.yml only tags and
# publishes a Release for plugin-manifest version bumps on push to main,
# it never runs a test. This workflow is the missing test/typecheck gate.
#
# Each job only installs the toolchain it actually needs (Node for the two
# Cline plugin jobs, Python for the tooling jobs) and
# fails the workflow on any test or typecheck failure -- no step swallows a
# nonzero exit.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cline-plugin:
    name: cline/ (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # package.json declares npm workspaces (cline, cline-agents,
      # cline-lifecycle) backed by a single root package-lock.json, so
      # `npm ci` must run from the repo root -- a per-directory lockfile no
      # longer exists.
      - run: npm ci
      - run: npm test
        working-directory: cline
      - run: npm run typecheck
        working-directory: cline

  cline-agents-plugin:
    name: cline-agents/ (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # cline-agents/ is added by a separate, still-open PR
      # (deagy/cadre-lifecycle#6, branch deagy/cline-agent-team-port). Until
      # that merges, this job intentionally has nothing to run on main --
      # it must not fail the workflow just because the directory doesn't
      # exist yet, but it also must not silently disappear once the
      # directory lands. Once merged, package-lock.json's presence drives
      # normal npm ci/test/typecheck below with no further changes needed
      # here.
      - name: Check for cline-agents/
        id: probe
        run: |
          if [ -f cline-agents/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cline-agents/package.json not found on this ref (expected until deagy/cadre-lifecycle#6 merges) -- skipping this job's remaining steps."
          fi
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # package.json declares npm workspaces (cline, cline-agents,
      # cline-lifecycle) backed by a single root package-lock.json, so
      # `npm ci` must run from the repo root -- a per-directory lockfile no
      # longer exists.
      - name: npm ci
        if: steps.probe.outputs.present == 'true'
        run: npm ci
      - name: npm test
        if: steps.probe.outputs.present == 'true'
        working-directory: cline-agents
        run: npm test
      - name: npm run typecheck
        if: steps.probe.outputs.present == 'true'
        working-directory: cline-agents
        run: npm run typecheck

  cline-lifecycle-plugin:
    name: cline-lifecycle/ (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # cline-lifecycle/index.test.mts's "real bin/cadre sdlc subprocess
      # calls" tests exercise the actual agentic-sdlc kernel binary, not a
      # mock -- without it installed here, every one of those tests only
      # ever exercises bin/cadre sdlc's own "kernel not found" fail-closed
      # path, silently passing regardless of whether the tool-argument
      # wiring is actually correct against a real kernel (found in review of
      # PR #34). Install the exact version this repo's own provider.json
      # declares as kernel_compatibility.minimum, the same one
      # plugins/lifecycle/tools/bootstrap_sdlc.py installs for a human
      # operator, read dynamically so this step can't itself drift stale.
      # `provider.json` is checked out from the PR's own head (this workflow
      # triggers on plain `pull_request`, not `pull_request_target`) -- a PR
      # editing kernel_compatibility.minimum controls what this step fetches.
      # Validate it's well-formed MAJOR.MINOR.PATCH before it ever reaches
      # the git ref, exactly like tools/plugin_version.py's SEMVER_PATTERN
      # and bootstrap_sdlc.py's own read_kernel_compatibility() do for the
      # same field elsewhere in this repo -- fail closed on anything else
      # (found in review of PR #34) rather than let an arbitrary string flow
      # into `git+...@v<string>`. Validation and extraction happen in one
      # Python invocation using re.fullmatch (whole-string by construction,
      # no re.MULTILINE), not a separate `echo "$value" | grep -E '^...$'`
      # step -- `grep` (without `-z`) matches per *line*, so a value
      # containing an embedded newline (a legal JSON string, e.g.
      # `"0.13.0\nanything"`, which `json.load` turns into a real newline in
      # the shell variable) could pass a piped grep check on its matching
      # line while the *whole* unsanitized value still reached `pip
      # install` -- found in a follow-up review of the first fix.
      - name: Install the pinned Agentic SDLC kernel
        run: |
          set -eu
          minimum=$(python3 -c '
          import json, re, sys
          value = json.load(open("provider.json"))["kernel_compatibility"]["minimum"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value):
              print(f"::error::provider.json kernel_compatibility.minimum ({value!r}) is not MAJOR.MINOR.PATCH semver", file=sys.stderr)
              raise SystemExit(1)
          print(value)
          ')
          pip install --user "git+https://github.com/deagy/agentic-sdlc.git@v${minimum}#subdirectory=plugins/agentic-sdlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # package.json declares npm workspaces (cline, cline-agents,
      # cline-lifecycle) backed by a single root package-lock.json, so
      # `npm ci` must run from the repo root -- a per-directory lockfile no
      # longer exists.
      - run: npm ci
      - run: npm test
        working-directory: cline-lifecycle
      - run: npm run typecheck
        working-directory: cline-lifecycle

  python-tools:
    name: tools/ and plugins/*/tools (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: tools/
        run: python3 -m unittest discover -s tools -p "test_*.py" -v
      - name: plugins/lifecycle/tools/
        run: python3 -m unittest discover -s plugins/lifecycle/tools -p "test_*.py" -v
      - name: plugins/lifecycle-github/tools/
        run: python3 -m unittest discover -s plugins/lifecycle-github/tools -p "test_*.py" -v
      - name: plugins/lifecycle-gitlab/tools/
        run: python3 -m unittest discover -s plugins/lifecycle-gitlab/tools -p "test_*.py" -v
