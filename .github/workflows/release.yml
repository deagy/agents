name: Release

# Tags and publishes a GitHub Release whenever a version bump lands on
# main. This is the release flow tools/plugin_version.py's docstring and
# README.md's "Releasing" section already describe -- previously aspirational,
# now real.
#
# A "version bump" is defined operationally, not just by these paths
# triggering: all 8 plugin manifests (4 plugins, see tools/plugin_version.py)
# must agree on a valid semver (checked below) and there must be no existing
# `v<version>` tag yet (also checked below). That second check is what makes
# this workflow idempotent -- a re-run, a push that touches these files
# without actually changing the version, or a manually-created tag/Release
# for the same version all become safe no-ops instead of a duplicate or
# failing run.
#
# Once this lands, do not tag or create the Release by hand for a version
# bump pushed to main -- this workflow will do it. Manual tagging is still
# fine for backfilling a version that predates this workflow (as v0.1.0
# through v0.2.4 were).
on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - ".codex-plugin/plugin.json"
      - "plugins/lifecycle/.claude-plugin/plugin.json"
      - "plugins/lifecycle/.codex-plugin/plugin.json"
      - "plugins/lifecycle-github/.claude-plugin/plugin.json"
      - "plugins/lifecycle-github/.codex-plugin/plugin.json"
      - "plugins/lifecycle-gitlab/.claude-plugin/plugin.json"
      - "plugins/lifecycle-gitlab/.codex-plugin/plugin.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify manifests agree on a valid version
        run: python3 tools/plugin_version.py --check

      - name: Read version
        id: version
        run: echo "value=$(python3 tools/plugin_version.py)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: tag
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "This version is already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG entry
        if: steps.tag.outputs.skip == 'false'
        run: python3 tools/changelog_entry.py "${{ steps.version.outputs.value }}" > /tmp/release-notes.md

      - name: Tag
        if: steps.tag.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.value }}" -m "Release v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Publish GitHub Release
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file /tmp/release-notes.md \
            --latest
