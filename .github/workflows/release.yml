name: release

# Auto-tags `main` once a version bump lands: a maintainer bumps
# plugins/secure-cloud-agents/{.claude-plugin,.codex-plugin}/plugin.json
# (via `agents version --set X.Y.Z`, see README.md "Releasing") through the
# normal PR flow. Once that PR merges, this workflow reads the now-current
# version, and if no `vX.Y.Z` tag exists for it yet, creates one at the
# merge commit and publishes a matching GitHub Release. Tags are only ever
# created after their content has already landed and been reviewed, so they
# stay immutable and never need to be moved or force-pushed.

on:
  push:
    branches: [main]
    paths:
      - "plugins/secure-cloud-agents/.claude-plugin/plugin.json"
      - "plugins/secure-cloud-agents/.codex-plugin/plugin.json"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify manifests agree on a valid version
        run: python3 -B agents/orchestration/src/plugin_version.py --check
      - name: Determine version and tag if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(python3 -B agents/orchestration/src/plugin_version.py)
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "release: ${tag} already exists, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          gh release create "${tag}" --title "${tag}" --generate-notes
